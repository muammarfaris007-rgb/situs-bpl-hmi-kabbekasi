name: Deploy ke InfinityFree

# Jalan otomatis setiap kali ada push ke branch main.
# Bisa juga dipicu manual lewat tab "Actions" di GitHub (tombol "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Kirim file ke InfinityFree lewat FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
            **/uploads/**
            **/api/config.php
            **/api/config.sample.php
            **/README.md
            **/DEPLOY-GITHUB-INFINITYFREE.md
